name: CI/CD

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gl-guardian-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8000/api/v1' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff==0.8.6

      - name: Dependency consistency
        run: python -m pip check

      - name: Ruff correctness check
        run: python -m ruff check app experiments scripts tests --select E,F,W --ignore E501,E701,E702,E731

      - name: Compile and import check
        run: python -m compileall -q app experiments scripts

      - name: Run backend tests
        run: python -m pytest

  research:
    name: Reproducible research checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research test dependencies
        run: python -m pip install pytest==8.3.4 pytest-asyncio==0.25.0
      - name: Generate benchmark and credential-free experiment
        run: |
          python scripts/generate_benchmark_dataset.py
          python scripts/run_all_experiments.py --dry-run
          python scripts/run_rule_baseline.py
          python scripts/generate_research_report.py
      - name: Validate research artifacts
        run: python scripts/check_research_artifacts.py
      - name: Run research pipeline tests
        # These tests are deliberately dependency-light. Do not load the
        # backend-wide conftest, which imports FastAPI and database fixtures.
        run: python -m pytest --noconftest tests/test_research_pipeline.py -q

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NEXT_PUBLIC_API_BASE_URL }}
        run: pnpm build

  docker:
    name: Build and publish/validate images
    runs-on: ubuntu-latest
    needs: [backend, frontend, research, security]
    if: >-
      always() &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.research.result == 'success' &&
      needs.security.result == 'success'
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      ui_image: ${{ steps.images.outputs.ui_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image names
        id: images
        run: |
          REPOSITORY_LC="${GITHUB_REPOSITORY,,}"
          echo "backend_image=${REGISTRY}/${REPOSITORY_LC}-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ui_image=${REGISTRY}/${REPOSITORY_LC}-ui:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${REGISTRY}/${REPOSITORY_LC}-backend:latest" >> "$GITHUB_OUTPUT"
          echo "ui_latest=${REGISTRY}/${REPOSITORY_LC}-ui:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: Backend
          file: Backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.images.outputs.backend_image }}
            ${{ steps.images.outputs.backend_latest }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: UI
          file: UI/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_API_TOKEN=${{ secrets.NEXT_PUBLIC_API_TOKEN }}
            NEXT_PUBLIC_API_USERNAME=${{ secrets.NEXT_PUBLIC_API_USERNAME }}
            NEXT_PUBLIC_API_PASSWORD=${{ secrets.NEXT_PUBLIC_API_PASSWORD }}
          tags: |
            ${{ steps.images.outputs.ui_image }}
            ${{ steps.images.outputs.ui_latest }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
